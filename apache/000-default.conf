<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    # Proxy hacia la API Python
    ProxyPreserveHost On
    ProxyPass /api http://python:8080/api
    ProxyPassReverse /api http://python:8080/api

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Send apache logs to stdout and stderr
    LogFormat "%v %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" \"%{X-Forwarded-For}i\" %D" extended

    CustomLog /proc/self/fd/1 extended
    ErrorLog /proc/self/fd/2
    LogLevel trace8

</VirtualHost>

